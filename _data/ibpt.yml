titulo: IBPT-STEM
subtitulo: Problemas del entorno como punto de partida para investigar
descripcion: La Investigación Basada en Problemas y Tecnología se combina con ciencia, tecnología, ingeniería y matemáticas. Los estudiantes usan indagación, experimentación y programación visual para abordar problemas de su comunidad.
fases:
  - Comprender el problema
  - Planificar las actividades
  - Ejecutar y experimentar
  - Revisar la solución
aplicacion: En abril de 2026, la UNAT informó que más de 30 docentes de los colegios Mariscal Cáceres y Daniel Hernández, en Tayacaja, participaron en una capacitación con el modelo IBPT, el kit STEM y programación por bloques.
